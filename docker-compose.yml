services:
  db:
    image: postgres:16-alpine
    container_name: tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-1111}:1111"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-tracker}
      DB_SSLMODE: disable
      PORT: 1111
      SESSION_SECRET: ${SESSION_SECRET:-tracker-production-cookie-secret-key-32b}
      PINGER_ENABLED: ${PINGER_ENABLED:-false}
      FNG_API_KEY: ${FNG_API_KEY:-}
    volumes:
      - uploads_data:/app/web/static/uploads

volumes:
  postgres_data:
  uploads_data:
